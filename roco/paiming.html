<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>洛克王国世界 - 宠物收集排行榜查询</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 50%, #f0f4ff 100%);
    min-height: 100vh;
    color: #333;
    padding: 16px;
    -webkit-text-size-adjust: 100%;
  }
  .container { max-width: 1200px; margin: 0 auto; width: 100%; }

  .header { text-align: center; margin-bottom: 20px; }
  .header h1 {
    font-size: clamp(20px, 5vw, 28px);
    background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .header p { color: #888; font-size: clamp(11px, 3vw, 13px); }

  .card {
    background: #fff;
    border: 1px solid #e8ecf1;
    border-radius: 12px; padding: 16px; margin-bottom: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }

  .query-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .query-row input[type="text"] {
    background: #f7f9fc; border: 1px solid #dde3ec;
    border-radius: 8px; padding: 10px 14px; color: #333; font-size: 14px;
    outline: none; flex: 1; min-width: 0;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  .query-row input:focus { border-color: #667eea; }
  .btn {
    padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    -webkit-appearance: none;
  }
  .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(102,126,234,0.35); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .tabs {
    display: flex; gap: 4px; margin-bottom: 14px;
    background: #f0f3f8; border-radius: 10px; padding: 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab {
    flex: 1; min-width: fit-content; padding: 10px 12px; text-align: center; border-radius: 8px;
    cursor: pointer; font-size: clamp(12px, 3.5vw, 14px); font-weight: 500; color: #888;
    transition: all 0.2s; border: none; background: transparent;
    white-space: nowrap;
  }
  .tab:hover { color: #555; }
  .tab.active { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .tab.active.glass { color: #d4a017; background: #fff8e1; }
  .tab.active.shining { color: #e91e63; background: #fce4ec; }
  .tab.active.total { color: #667eea; background: #e8eaf6; }

  .current-player {
    background: linear-gradient(135deg, #fff8e1, #fce4ec);
    border: 1px solid #ffe082; border-radius: 12px; padding: 16px;
    margin-bottom: 14px; display: none;
  }
  .current-player.show { display: block; }
  .current-player .cp-title { font-size: 13px; color: #f57c00; margin-bottom: 10px; font-weight: 600; }
  .cp-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px;
  }
  .cp-item { background: rgba(255,255,255,0.7); border-radius: 8px; padding: 10px; text-align: center; }
  .cp-item .cp-label { font-size: 11px; color: #999; margin-bottom: 4px; }
  .cp-item .cp-value { font-size: clamp(16px, 4vw, 20px); font-weight: 700; }
  .cp-item .cp-value.gold { color: #d4a017; }
  .cp-item .cp-value.pink { color: #e91e63; }
  .cp-item .cp-value.cyan { color: #667eea; }
  .cp-name { font-size: clamp(15px, 4vw, 18px); font-weight: 700; color: #333; margin-bottom: 2px; word-break: break-all; }
  .cp-uid { font-size: 11px; color: #aaa; }
  .cp-signature { font-size: 12px; color: #777; margin-top: 6px; font-style: italic; word-break: break-all; }

  /* 桌面端表格 */
  .table-wrap { overflow-x: auto; border-radius: 8px; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: #f5f7fa; padding: 12px 10px; text-align: left;
    color: #666; font-weight: 600; white-space: nowrap;
    border-bottom: 2px solid #e8ecf1;
  }
  tbody td { padding: 10px; border-bottom: 1px solid #f0f3f8; white-space: nowrap; }
  tbody tr:hover { background: #f8faff; }
  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%; font-weight: 700; font-size: 13px;
  }
  .rank-1 { background: linear-gradient(135deg, #ffd700, #ffb300); color: #fff; }
  .rank-2 { background: linear-gradient(135deg, #b0bec5, #90a4ae); color: #fff; }
  .rank-3 { background: linear-gradient(135deg, #d7a86e, #c4956a); color: #fff; }
  .rank-other { background: #eef1f6; color: #666; }
  .player-name { color: #333; font-weight: 500; }
  .count-glass { color: #d4a017; font-weight: 600; }
  .count-shining { color: #e91e63; font-weight: 600; }
  .signature-cell { max-width: 200px; overflow: hidden; text-overflow: ellipsis; color: #999; font-size: 12px; }

  /* 手机端卡片列表 */
  .card-list { display: none; }
  .rank-card {
    background: #fff; border: 1px solid #f0f3f8; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
  }
  .rank-card .rc-rank { flex-shrink: 0; }
  .rank-card .rc-info { flex: 1; min-width: 0; }
  .rank-card .rc-name { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 4px; word-break: break-all; }
  .rank-card .rc-counts { display: flex; gap: 14px; font-size: 12px; flex-wrap: wrap; }
  .rank-card .rc-counts span { color: #888; }
  .rank-card .rc-counts strong { font-weight: 600; }
  .rank-card .rc-sig { font-size: 11px; color: #aaa; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-card .rc-ranks { display: flex; gap: 6px; flex-shrink: 0; }
  .rank-card .rc-rank-item { text-align: center; }
  .rank-card .rc-rank-item .rc-rank-label { font-size: 10px; color: #aaa; margin-bottom: 2px; }

  .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .pagination button {
    background: #fff; border: 1px solid #dde3ec;
    color: #555; padding: 7px 16px; border-radius: 6px; cursor: pointer;
    font-size: 13px; transition: all 0.2s; -webkit-appearance: none;
  }
  .pagination button:hover:not(:disabled) { background: #667eea; border-color: #667eea; color: #fff; }
  .pagination button:disabled { opacity: 0.35; cursor: not-allowed; }
  .pagination .page-info { color: #888; font-size: 13px; }

  .loading { text-align: center; padding: 40px 20px; color: #999; }
  .spinner {
    display: inline-block; width: 30px; height: 30px;
    border: 3px solid #eef1f6; border-top-color: #667eea;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg {
    background: #fff5f5; border: 1px solid #ffcdd2;
    color: #c62828; padding: 14px; border-radius: 8px; font-size: 13px; line-height: 1.8; word-break: break-all;
  }
  .empty-msg { text-align: center; padding: 40px 20px; color: #aaa; font-size: 14px; }
  .stats-bar { display: flex; gap: 16px; margin-bottom: 10px; font-size: 13px; color: #888; flex-wrap: wrap; }
  .stats-bar span strong { color: #667eea; }

  .hint { font-size: 12px; color: #aaa; margin-top: 8px; line-height: 1.6; }
  .hint code {
    background: #f0f3f8; padding: 2px 6px; border-radius: 4px;
    color: #667eea; font-size: 11px; word-break: break-all;
  }

  /* ========== 响应式 ========== */
  @media (max-width: 768px) {
    body { padding: 12px; }
    .card { padding: 14px; border-radius: 10px; }
    .header { margin-bottom: 16px; }

    /* 手机端隐藏表格，显示卡片列表 */
    .table-wrap { display: none; }
    .card-list { display: block; }

    .query-row input[type="text"] { min-width: 100%; }
    .query-row .btn { flex: 1; }

    .cp-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .cp-item { padding: 8px; }
  }

  @media (max-width: 480px) {
    body { padding: 10px; }
    .card { padding: 12px; margin-bottom: 10px; border-radius: 10px; }
    .tab { padding: 9px 8px; }
    .rank-card { padding: 10px 12px; gap: 10px; }
    .rank-card .rc-name { font-size: 13px; }
    .rank-card .rc-counts { gap: 10px; font-size: 11px; }
    .stats-bar { font-size: 12px; gap: 12px; }
    .pagination button { padding: 6px 14px; font-size: 12px; }
  }

  @media (min-width: 769px) {
    .card-list { display: none !important; }
    .table-wrap { display: block; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>洛克王国世界 · 宠物收集排行榜</h1>
    <p>炫彩 / 异色 / 总表 一站式查询</p>
  </div>

  <!-- 查询区 -->
  <div class="card">
    <div class="query-row">
      <input type="text" id="uidInput" placeholder="输入UID查询自己排名（留空则查询排行榜）" />
      <button class="btn btn-primary" id="queryBtn" onclick="doQuery()">查询</button>
    </div>
    <div class="hint">不输入UID = 查询排行榜；输入UID = 同时显示你的排名和排行榜</div>
  </div>

  <!-- Tab 切换 -->
  <div class="tabs">
    <button class="tab glass active" data-tab="glass" onclick="switchTab('glass')">炫彩宠物排行榜</button>
    <button class="tab shining" data-tab="shining" onclick="switchTab('shining')">异色宠物排行榜</button>
    <button class="tab total" data-tab="total" onclick="switchTab('total')">宠物收集总表</button>
  </div>

  <!-- 当前玩家排名 -->
  <div class="current-player" id="currentPlayer">
    <div class="cp-title">★ 你的排名信息</div>
    <div class="cp-name" id="cpName">-</div>
    <div class="cp-uid" id="cpUid">-</div>
    <div class="cp-signature" id="cpSig"></div>
    <div class="cp-grid" id="cpGrid" style="margin-top:10px;"></div>
  </div>

  <!-- 结果区 -->
  <div class="card">
    <div class="stats-bar" id="statsBar"></div>
    <div id="resultArea">
      <div class="empty-msg">点击「查询」开始</div>
    </div>
    <div class="pagination" id="pagination" style="display:none;"></div>
  </div>
</div>

<script>
const API_BASE = 'https://wegame.shallow.ink/api/v1/games/rocom/ingame/player/card/pet-stats';
const API_KEY = 'sk-e159f917ad55a73184d64ae08d4cf714';
const ENDPOINTS = {
  glass:   '/rankings/glass',
  shining: '/rankings/shining',
  total:   '/players'
};

let currentTab = 'glass';
let currentPage = 1;
const PAGE_SIZE = 50;
let hasQueried = false;

function switchTab(tab) {
  currentTab = tab;
  currentPage = 1;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  if (hasQueried) doQuery();
}

document.getElementById('uidInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doQuery();
});

async function fetchAPI(endpoint, params) {
  const url = new URL(API_BASE + endpoint);
  Object.entries(params).forEach(([k, v]) => {
    if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v);
  });

  const res = await fetch(url.toString(), {
    method: 'GET',
    headers: { 'X-API-Key': API_KEY }
  });

  if (!res.ok) {
    const text = await res.text().catch(() => '');
    throw new Error(`HTTP ${res.status}: ${text || res.statusText}`);
  }

  const json = await res.json();
  if (json.code !== 0) {
    throw new Error(json.message || `接口返回错误 code=${json.code}`);
  }
  return json.data;
}

async function doQuery() {
  const uid = document.getElementById('uidInput').value.trim();
  const btn = document.getElementById('queryBtn');
  const resultArea = document.getElementById('resultArea');
  const pagination = document.getElementById('pagination');
  const currentPlayerEl = document.getElementById('currentPlayer');

  btn.disabled = true;
  btn.textContent = '查询中...';
  resultArea.innerHTML = '<div class="loading"><div class="spinner"></div>正在加载数据...</div>';
  pagination.style.display = 'none';
  currentPlayerEl.classList.remove('show');
  document.getElementById('statsBar').innerHTML = '';

  try {
    let data;
    if (currentTab === 'total') {
      data = await fetchAPI(ENDPOINTS.total, {
        page: currentPage, page_size: PAGE_SIZE,
        uid: uid || undefined, resolve_names: true
      });
    } else {
      data = await fetchAPI(ENDPOINTS[currentTab], {
        limit: 100, uid: uid || undefined, resolve_names: true
      });
    }

    hasQueried = true;
    renderResult(data, uid);
  } catch (err) {
    let msg = err.message;
    if (msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('Load failed')) {
      msg = '跨域请求被拦截（CORS）。请用以下命令启动 Chrome 后再访问：<br><code>chrome --disable-web-security --user-data-dir=/tmp/chrome_dev</code>';
    }
    resultArea.innerHTML = `<div class="error-msg">❌ ${msg}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '查询';
  }
}

function renderResult(data, uid) {
  const resultArea = document.getElementById('resultArea');
  const statsBar = document.getElementById('statsBar');
  const items = data.items || [];
  const total = data.total || 0;

  let statsHtml = `<span>共 <strong>${total}</strong> 名玩家</span>`;
  if (currentTab === 'total') {
    statsHtml += `<span>第 <strong>${data.page}</strong> / <strong>${Math.ceil(total / data.page_size) || 1}</strong> 页</span>`;
  }
  statsBar.innerHTML = statsHtml;

  if (uid && data.current) {
    renderCurrentPlayer(data.current, uid);
  } else if (uid && !data.current) {
    document.getElementById('currentPlayer').classList.add('show');
    document.getElementById('cpName').textContent = '未找到该UID的排名数据';
    document.getElementById('cpUid').textContent = `UID: ${uid}`;
    document.getElementById('cpSig').textContent = '该UID可能尚未被系统收录，请确认UID是否正确';
    document.getElementById('cpGrid').innerHTML = '';
  }

  if (items.length === 0) {
    resultArea.innerHTML = '<div class="empty-msg">暂无数据</div>';
    return;
  }

  // 桌面端表格 + 手机端卡片列表，同时渲染，CSS控制显示
  let html = renderTable(items) + renderCardList(items);
  resultArea.innerHTML = html;

  if (currentTab === 'total' && total > PAGE_SIZE) {
    renderPagination(data.page, Math.ceil(total / data.page_size));
  }
}

function renderTable(items) {
  let tableHtml = '<div class="table-wrap"><table><thead><tr>';
  if (currentTab === 'total') {
    tableHtml += '<th>炫彩排名</th><th>异色排名</th><th>玩家</th><th>炫彩数量</th><th>异色数量</th><th>名片签名</th>';
  } else {
    const isGlass = currentTab === 'glass';
    tableHtml += `<th>排名</th><th>玩家</th><th>${isGlass ? '炫彩数量' : '异色数量'}</th><th>${isGlass ? '异色数量' : '炫彩数量'}</th><th>名片签名</th>`;
  }
  tableHtml += '</tr></thead><tbody>';

  items.forEach(item => {
    if (currentTab === 'total') {
      tableHtml += `<tr>
        <td><span class="rank-badge ${getRankClass(item.glass_rank)}">${item.glass_rank || '-'}</span></td>
        <td><span class="rank-badge ${getRankClass(item.shining_rank)}">${item.shining_rank || '-'}</span></td>
        <td class="player-name">${escapeHtml(item.player_name || '未知')}</td>
        <td class="count-glass">${item.collected_glass_pet_count ?? 0}</td>
        <td class="count-shining">${item.collected_shining_pet_count ?? 0}</td>
        <td class="signature-cell" title="${escapeHtml(item.card_signature || '')}">${escapeHtml(item.card_signature || '-')}</td>
      </tr>`;
    } else {
      const isGlass = currentTab === 'glass';
      const mainCount = isGlass ? item.collected_glass_pet_count : item.collected_shining_pet_count;
      const subCount = isGlass ? item.collected_shining_pet_count : item.collected_glass_pet_count;
      const mainClass = isGlass ? 'count-glass' : 'count-shining';
      const subClass = isGlass ? 'count-shining' : 'count-glass';
      tableHtml += `<tr>
        <td><span class="rank-badge ${getRankClass(item.rank)}">${item.rank || '-'}</span></td>
        <td class="player-name">${escapeHtml(item.player_name || '未知')}</td>
        <td class="${mainClass}">${mainCount ?? 0}</td>
        <td class="${subClass}">${subCount ?? 0}</td>
        <td class="signature-cell" title="${escapeHtml(item.card_signature || '')}">${escapeHtml(item.card_signature || '-')}</td>
      </tr>`;
    }
  });

  tableHtml += '</tbody></table></div>';
  return tableHtml;
}

function renderCardList(items) {
  let html = '<div class="card-list">';
  items.forEach(item => {
    if (currentTab === 'total') {
      html += `<div class="rank-card">
        <div class="rc-ranks">
          <div class="rc-rank-item">
            <div class="rc-rank-label">炫彩</div>
            <span class="rank-badge ${getRankClass(item.glass_rank)}">${item.glass_rank || '-'}</span>
          </div>
          <div class="rc-rank-item">
            <div class="rc-rank-label">异色</div>
            <span class="rank-badge ${getRankClass(item.shining_rank)}">${item.shining_rank || '-'}</span>
          </div>
        </div>
        <div class="rc-info">
          <div class="rc-name">${escapeHtml(item.player_name || '未知')}</div>
          <div class="rc-counts">
            <span>炫彩 <strong class="count-glass">${item.collected_glass_pet_count ?? 0}</strong></span>
            <span>异色 <strong class="count-shining">${item.collected_shining_pet_count ?? 0}</strong></span>
          </div>
          ${item.card_signature ? `<div class="rc-sig">${escapeHtml(item.card_signature)}</div>` : ''}
        </div>
      </div>`;
    } else {
      const isGlass = currentTab === 'glass';
      const mainCount = isGlass ? item.collected_glass_pet_count : item.collected_shining_pet_count;
      const subCount = isGlass ? item.collected_shining_pet_count : item.collected_glass_pet_count;
      const mainLabel = isGlass ? '炫彩' : '异色';
      const subLabel = isGlass ? '异色' : '炫彩';
      const mainClass = isGlass ? 'count-glass' : 'count-shining';
      const subClass = isGlass ? 'count-shining' : 'count-glass';
      html += `<div class="rank-card">
        <div class="rc-rank">
          <span class="rank-badge ${getRankClass(item.rank)}">${item.rank || '-'}</span>
        </div>
        <div class="rc-info">
          <div class="rc-name">${escapeHtml(item.player_name || '未知')}</div>
          <div class="rc-counts">
            <span>${mainLabel} <strong class="${mainClass}">${mainCount ?? 0}</strong></span>
            <span>${subLabel} <strong class="${subClass}">${subCount ?? 0}</strong></span>
          </div>
          ${item.card_signature ? `<div class="rc-sig">${escapeHtml(item.card_signature)}</div>` : ''}
        </div>
      </div>`;
    }
  });
  html += '</div>';
  return html;
}

function renderCurrentPlayer(current, uid) {
  const el = document.getElementById('currentPlayer');
  el.classList.add('show');
  document.getElementById('cpName').textContent = current.player_name || '未知玩家';
  document.getElementById('cpUid').textContent = `UID: ${uid}`;
  document.getElementById('cpSig').textContent = current.card_signature ? `签名: ${current.card_signature}` : '';

  let gridHtml = '';
  if (currentTab === 'glass') {
    gridHtml = `
      <div class="cp-item"><div class="cp-label">炫彩排名</div><div class="cp-value gold">${current.rank ?? '-'}</div></div>
      <div class="cp-item"><div class="cp-label">炫彩数量</div><div class="cp-value gold">${current.collected_glass_pet_count ?? 0}</div></div>
      <div class="cp-item"><div class="cp-label">异色数量</div><div class="cp-value pink">${current.collected_shining_pet_count ?? 0}</div></div>`;
  } else if (currentTab === 'shining') {
    gridHtml = `
      <div class="cp-item"><div class="cp-label">异色排名</div><div class="cp-value pink">${current.rank ?? '-'}</div></div>
      <div class="cp-item"><div class="cp-label">异色数量</div><div class="cp-value pink">${current.collected_shining_pet_count ?? 0}</div></div>
      <div class="cp-item"><div class="cp-label">炫彩数量</div><div class="cp-value gold">${current.collected_glass_pet_count ?? 0}</div></div>`;
  } else {
    gridHtml = `
      <div class="cp-item"><div class="cp-label">炫彩排名</div><div class="cp-value gold">${current.glass_rank ?? '-'}</div></div>
      <div class="cp-item"><div class="cp-label">异色排名</div><div class="cp-value pink">${current.shining_rank ?? '-'}</div></div>
      <div class="cp-item"><div class="cp-label">炫彩数量</div><div class="cp-value gold">${current.collected_glass_pet_count ?? 0}</div></div>
      <div class="cp-item"><div class="cp-label">异色数量</div><div class="cp-value pink">${current.collected_shining_pet_count ?? 0}</div></div>`;
  }
  document.getElementById('cpGrid').innerHTML = gridHtml;
}

function renderPagination(page, totalPages) {
  const pagination = document.getElementById('pagination');
  pagination.style.display = 'flex';
  pagination.innerHTML = `
    <button onclick="goPage(${page - 1})" ${page <= 1 ? 'disabled' : ''}>上一页</button>
    <span class="page-info">第 ${page} / ${totalPages} 页</span>
    <button onclick="goPage(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>下一页</button>`;
}

function goPage(p) { currentPage = p; doQuery(); }
function getRankClass(rank) {
  if (rank === 1) return 'rank-1';
  if (rank === 2) return 'rank-2';
  if (rank === 3) return 'rank-3';
  return 'rank-other';
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
